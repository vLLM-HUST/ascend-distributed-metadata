name: Custody policy tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Custody policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/.github
          ref: b746a90a9f4d6602816c9c8c773639467eb6d6bc
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_benchmark_data_policy.py -v
